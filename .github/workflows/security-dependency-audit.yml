name: Security dependency audit

on:
  push:
    branches:
      - chore/security-audit-artifact
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate reproducible dependency lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Capture complete npm audit report
        run: npm audit --json > npm-audit.json || true

      - name: Capture resolved dependency tree
        run: npm ls --all --json > dependency-tree.json || true

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pambala-security-audit
          path: |
            package-lock.json
            npm-audit.json
            dependency-tree.json
          if-no-files-found: warn
          retention-days: 14
